---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUNDLE_WITHOUT: debug

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # keep in sync with required_ruby_version in the gemspec
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        include:
          # early warning for the next ruby release; allowed to fail
          - os: ubuntu-latest
            ruby: head
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  # User/group switching, login simulation and cgroups only run as root.
  test-root:
    name: Ruby ${{ matrix.ruby }} on ubuntu-latest as root
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: sudo --preserve-env env "PATH=$PATH" bundle exec rspec

  # Ruby is moving towards frozen string literals by default. Run everything,
  # dependencies included, with them forced on so we find out early.
  frozen-string-literals:
    name: Frozen string literals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUBYOPT: --enable-frozen-string-literal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rspec

  # Build the gems exactly as a release would, install the result somewhere
  # isolated and make sure it works without the source tree.
  package:
    name: Build and install gem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
      - name: Build gems
        run: |
          gem build mixlib-shellout.gemspec --strict
          gem build mixlib-shellout-universal-mingw-ucrt.gemspec --strict
      - name: Install and smoke test outside the source tree
        run: |
          export GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems"
          gem install --no-document "./mixlib-shellout-$(cat VERSION).gem"
          cd "$RUNNER_TEMP"
          ruby - <<'RUBY'
            require "mixlib/shellout"
            require "mixlib/shellout/helper"
            require "mixlib/shellout/version"
            abort "not loaded from the installed gem" unless Gem.loaded_specs.key?("mixlib-shellout")
            cmd = Mixlib::ShellOut.new("echo", "hello").run_command
            cmd.error!
            abort "unexpected output: #{cmd.stdout.inspect}" unless cmd.stdout == "hello\n"
            puts "mixlib-shellout #{Mixlib::ShellOut::VERSION} OK"
          RUBY
